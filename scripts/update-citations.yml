name: Update Google Scholar Citations

on:
  schedule:
    # Run every day at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    paths:
      - 'scripts/fetch_citations.py'

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Citation Scraper
        run: |
          python scripts/fetch_citations.py

      - name: Commit and Push if Changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/citations.json
          if git diff --staged --quiet; then
            echo "No changes to citation data."
          else
            git commit -m "chore(citations): auto-sync Google Scholar citation counts [skip ci]"
            git push
          fi
